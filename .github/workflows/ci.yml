name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: mongodb://localhost:27017/tycoma?replicaSet=rs0&directConnection=true
      # Required by src/shared/env.ts at module scope during `next build`; test-only value.
      AUTH_SECRET: ci-test-only-secret-0123456789abcdef
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Vulnerability audit
        # Phase C: fail on critical and high. Document any time-boxed exceptions
        # in `docs/lessons.md` with the advisory id + intended removal date.
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build