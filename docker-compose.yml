services:
  mongo:
    image: mongo:7
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    # Bind mount keeps the database in a path humans can see and back up.
    # The directory is gitignored; do not commit its contents.
    volumes:
      - ./data/mongo:/data/db
    healthcheck:
      test: >
        echo "try { rs.status() } catch (err) { rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}) }" | mongosh --quiet
      interval: 5s
      timeout: 15s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  localstack:
    image: localstack/localstack:3
    ports:
      - "4566:4566"
    environment:
      SERVICES: s3
      DEBUG: "0"
    volumes:
      - ./data/localstack:/var/lib/localstack

# Note: there is no top-level `volumes:` block. The bind mounts above write
# into the host filesystem (paths under `data/`); Docker does not own them.
# Removing the host directories deletes the database. See
# `scripts/mongo-dump.mjs` and `docs/release-runbook.md` § Backup.
